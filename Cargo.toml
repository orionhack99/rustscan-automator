[package]
name = "rustscan-automator"
version = "0.1.0"
edition = "2021"
description = "Reconnaissance automation tool that orchestrates RustScan in place of nmap"
license = "MIT"
readme = "README.md"

[lib]
name = "rustscan_automator"
path = "src/lib.rs"

[[bin]]
name = "rustscan-automator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[[test]]
name = "cli_port_test"
path = "tests/contract/cli_port_test.rs"

[[test]]
name = "parser_test"
path = "tests/unit/parser_test.rs"

[[test]]
name = "service_parser_test"
path = "tests/unit/service_parser_test.rs"

[[test]]
name = "target_cidr_test"
path = "tests/unit/target_cidr_test.rs"

[[test]]
name = "privilege_test"
path = "tests/unit/privilege_test.rs"

[[test]]
name = "port_mode_test"
path = "tests/integration/port_mode_test.rs"

[[test]]
name = "service_mode_test"
path = "tests/integration/service_mode_test.rs"

[[test]]
name = "network_mode_test"
path = "tests/integration/network_mode_test.rs"

[[test]]
name = "comprehensive_mode_test"
path = "tests/integration/comprehensive_mode_test.rs"

[[test]]
name = "output_layout_test"
path = "tests/integration/output_layout_test.rs"

[[test]]
name = "no_external_tools_test"
path = "tests/integration/no_external_tools_test.rs"

[[test]]
name = "smoke_test"
path = "tests/integration/smoke_test.rs"
