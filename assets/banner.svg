<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="RustScan Automator - red team reconnaissance banner">
  <title>RustScan Automator — Red Team Reconnaissance</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090b"/>
      <stop offset="0.5" stop-color="#06110d"/>
      <stop offset="1" stop-color="#0b0507"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafff5"/>
      <stop offset="0.5" stop-color="#5cffb0"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff88" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.30"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .dim { fill: #6f8579; }
      .green { fill: #39ff9e; }
      .red { fill: #ff4d4d; }
      .white { fill: #e8fff5; }
      .cyan { fill: #7fe9ff; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="1026" cy="214" r="250" fill="url(#glowGreen)"/>
  <circle cx="150" cy="380" r="190" fill="url(#glowRed)"/>

  <!-- faint binary rain (background) -->
  <g class="mono green" font-size="14" opacity="0.07">
    <text x="360" y="40">101101001011</text>
    <text x="500" y="70">011010010110</text>
    <text x="640" y="34">110100101100</text>
    <text x="820" y="60">100101101001</text>
    <text x="1120" y="46">011011001010</text>
    <text x="400" y="400">110010110101</text>
    <text x="600" y="410">101100101011</text>
    <text x="880" y="398">010110110010</text>
    <text x="1140" y="404">101011001101</text>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#ff2d2d" stroke-width="2" opacity="0.6" fill="none">
    <path d="M16 46 V16 H46"/>
    <path d="M1264 46 V16 H1234"/>
    <path d="M16 374 V404 H46"/>
    <path d="M1264 374 V404 H1234"/>
  </g>

  <!-- ===================== LEFT: TITLE + TERMINAL ===================== -->
  <!-- red team badge -->
  <rect x="48" y="40" width="286" height="34" rx="17" fill="#ff2d2d" fill-opacity="0.12" stroke="#ff2d2d" stroke-opacity="0.7"/>
  <circle cx="70" cy="57" r="5" class="red"/>
  <text x="88" y="63" class="mono red" font-size="15" letter-spacing="2.5" font-weight="700">RED TEAM // RECON</text>

  <!-- title -->
  <text x="48" y="152" class="mono" font-size="60" font-weight="700" letter-spacing="1.5" fill="url(#titleGrad)" filter="url(#glow)">RUSTSCAN AUTOMATOR</text>
  <!-- subtitle -->
  <text x="50" y="186" class="mono dim" font-size="19">Reconnaissance automation · RustScan in place of nmap</text>

  <!-- terminal window -->
  <rect x="48" y="212" width="712" height="176" rx="10" fill="#040a07" fill-opacity="0.92" stroke="#00ff88" stroke-opacity="0.30"/>
  <rect x="48" y="212" width="712" height="30" rx="10" fill="#00ff88" fill-opacity="0.06"/>
  <line x1="48" y1="242" x2="760" y2="242" stroke="#00ff88" stroke-opacity="0.22"/>
  <circle cx="70" cy="227" r="5" fill="#ff5f56"/>
  <circle cx="88" cy="227" r="5" fill="#ffbd2e"/>
  <circle cx="106" cy="227" r="5" fill="#27c93f"/>
  <text x="730" y="232" class="mono dim" font-size="13" text-anchor="end">bash — recon</text>

  <g class="mono" font-size="16.5">
    <text x="70" y="276" class="green">$</text>
    <text x="90" y="276" class="white">rustscan-automator -H 10.10.10.5 -t port</text>
    <text x="70" y="304" class="cyan">[*] 10.10.10.5 -&gt; [22,80,443]</text>
    <text x="70" y="332" class="green">[+] 22/tcp open ssh     OpenSSH 8.2p1</text>
    <text x="70" y="360" class="green">[+] 80/tcp open http    nginx 1.18.0</text>
    <rect x="316" y="346" width="10" height="18" fill="#39ff9e" opacity="0.85"/>
  </g>

  <!-- ===================== RIGHT: RADAR / TARGET ===================== -->
  <g transform="translate(1026 214)">
    <!-- rings -->
    <g fill="none" stroke="#00ff88">
      <circle r="150" stroke-opacity="0.35"/>
      <circle r="112" stroke-opacity="0.25"/>
      <circle r="74" stroke-opacity="0.20"/>
      <circle r="36" stroke-opacity="0.18"/>
    </g>
    <!-- crosshair -->
    <g stroke="#00ff88" stroke-opacity="0.30">
      <line x1="-166" y1="0" x2="166" y2="0"/>
      <line x1="0" y1="-166" x2="0" y2="166"/>
    </g>
    <!-- sweep wedge -->
    <path d="M0 0 L0 -150 A150 150 0 0 1 150 0 Z" fill="#00ff88" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#39ff9e" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)"/>
    <!-- outer ticks -->
    <g stroke="#00ff88" stroke-opacity="0.5">
      <line x1="0" y1="-150" x2="0" y2="-160"/>
      <line x1="150" y1="0" x2="160" y2="0"/>
      <line x1="0" y1="150" x2="0" y2="160"/>
      <line x1="-150" y1="0" x2="-160" y2="0"/>
    </g>
    <!-- blips -->
    <circle cx="72" cy="-64" r="6" class="red" filter="url(#glow)"/>
    <circle cx="-58" cy="46" r="5" class="green" filter="url(#glow)"/>
    <circle cx="96" cy="70" r="4.5" class="green"/>
    <circle cx="-30" cy="-96" r="4.5" class="red"/>
    <!-- target lock on a blip -->
    <g stroke="#ff4d4d" stroke-width="1.6" fill="none" opacity="0.9">
      <path d="M60 -76 h-12 v12"/>
      <path d="M84 -76 h12 v12"/>
      <path d="M60 -52 h-12 v-12"/>
      <path d="M84 -52 h12 v-12"/>
    </g>
    <!-- center -->
    <circle r="5" fill="#eafff5"/>
    <circle r="11" fill="none" stroke="#eafff5" stroke-opacity="0.5"/>
  </g>
  <text x="1026" y="404" class="mono dim" font-size="13" text-anchor="middle" letter-spacing="4">SCOPE · ENUMERATE · REPORT</text>

  <!-- scanline overlay -->
  <rect width="1280" height="420" fill="url(#scan)" pointer-events="none"/>
</svg>
